<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15170f">
<title>Wardogs Squad Bingo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#15170f; --panel:#1f2216; --cell:#262a1b; --line:#3a3f2a;
  --fg:#e7e4d2; --muted:#9a9a80; --accent:#f2a516; --hit:#c8401f; --zone:#7fae3a;
  --display:"Black Ops One", Impact, "Arial Black", sans-serif;
  --body:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:repeating-linear-gradient(135deg,transparent 0 22px,rgba(242,165,22,.025) 22px 44px);}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:4px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,56px);line-height:.95;margin:0;letter-spacing:.02em}
h1 span{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0}
button{font-family:var(--body);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,textarea:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"],button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);min-height:1.2em}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--line);padding:4px;border-radius:4px}
.cell{position:relative;aspect-ratio:1;max-width:100%;background:var(--cell);display:flex;align-items:center;justify-content:center;
  text-align:center;padding:4px;min-width:0;overflow:hidden}
.cell textarea{width:100%;height:100%;resize:none;background:transparent;border:0;color:var(--fg);
  font-family:var(--body);font-weight:600;font-size:clamp(11px,2.6vw,15px);line-height:1.1;text-align:center;
  padding:18px 2px 2px;overflow:hidden}
.cell textarea::placeholder{color:var(--line)}
.num{position:absolute;top:3px;left:5px;font-family:var(--mono);font-size:9px;color:var(--muted)}
.cell .txt{font-weight:600;font-size:clamp(11px,2.6vw,15px);line-height:1.1;overflow-wrap:anywhere}
.play .cell{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.cell.marked{background:#3a1d12}
.cell.marked::after{content:"";position:absolute;inset:10%;border:3px solid var(--hit);border-radius:50%;transform:rotate(-8deg);opacity:.9}
.cell.win{background:#4a2410}
.free{background:#22301a}
.free .txt{font-family:var(--display);font-weight:400;color:var(--zone);font-size:clamp(11px,2.4vw,15px)}
.free .sub{display:block;font-family:var(--mono);font-size:8px;color:var(--muted);margin-top:2px;letter-spacing:.08em}
.banner{font-family:var(--display);font-size:28px;color:#1a1405;background:var(--accent);text-align:center;padding:8px;border-radius:4px;letter-spacing:.06em}
[hidden]{display:none!important}
.share{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
.share p{margin:0;color:var(--muted);font-size:15px}
#linkOut{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:11px;padding:8px;resize:none;height:64px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.danger{color:var(--hit)}
@media (prefers-reduced-motion:no-preference){.cell.marked::after{animation:stamp .18s ease-out}}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.4);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag" id="tag">Squad card · 100-player KOTH · 3 armies</div>
    <h1>WARDOGS <span>BINGO</span></h1>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="Mode">
      <button id="mWrite" aria-pressed="true">Write</button>
      <button id="mPlay" aria-pressed="false">Play</button>
    </div>
    <div class="tools">
      <button id="shuffle">Shuffle</button>
      <button id="clearMarks">Clear marks</button>
    </div>
  </div>
  <div class="status" id="status"></div>

  <div class="banner" id="banner" hidden>BINGO — ZONE CAPTURED</div>
  <div class="grid" id="grid"></div>

  <section class="share" id="share">
    <p>Done writing? Copy the squad link and drop it in Discord. Everyone who opens it gets the same squares on their own shuffled card.</p>
    <button class="primary" id="copyLink">Copy squad link</button>
    <textarea id="linkOut" readonly hidden aria-label="Squad link"></textarea>
  </section>

  <div class="confirm" id="wipeRow"></div>
</div>

<script>
(function(){
  const N=24, LOCAL="wardogs-bingo-draft";
  const $=id=>document.getElementById(id), grid=$("grid"), status=$("status");

  // --- encode squares into the link (UTF-8 safe base64url) ---
  const enc=a=>btoa(unescape(encodeURIComponent(JSON.stringify(a)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  const dec=s=>{try{s=s.replace(/-/g,"+").replace(/_/g,"/");const a=JSON.parse(decodeURIComponent(escape(atob(s))));
    return Array.isArray(a)?Array(N).fill("").map((_,i)=>String(a[i]||"").slice(0,60)):null}catch(e){return null}};
  const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},
               set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

  const fromLink=dec((location.hash.match(/s=([^&]+)/)||[])[1]||"");
  let squares, mode, order, marks;
  const shuffleOrder=()=>{const o=[...Array(N).keys()];for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return o;};

  if(fromLink){
    // Squad member: land in Play with a card of their own
    squares=fromLink; mode="play";
    const saved=store.get("card:"+enc(squares));
    order=saved?.order||shuffleOrder(); marks=new Set(saved?.marks||[]);
    $("tag").textContent="Squad card · tap squares as they happen";
  }else{
    const d=store.get(LOCAL)||{};
    squares=d.squares||Array(N).fill(""); mode=d.mode||"write";
    order=d.order||[...Array(N).keys()]; marks=new Set(d.marks||[]);
  }
  const save=()=>{
    if(fromLink&&squares.join("\u0000")===fromLink.join("\u0000")) store.set("card:"+enc(squares),{order,marks:[...marks]});
    else store.set(LOCAL,{squares,mode,order,marks:[...marks]});
  };

  const lines=[];for(let r=0;r<5;r++){lines.push([0,1,2,3,4].map(c=>r*5+c));lines.push([0,1,2,3,4].map(c=>c*5+r));}
  lines.push([0,6,12,18,24],[4,8,12,16,20]);

  function render(){
    grid.className="grid"+(mode==="play"?" play":"");
    grid.innerHTML="";
    let k=0;
    for(let pos=0;pos<25;pos++){
      const cell=document.createElement("div");cell.className="cell";
      if(pos===12){cell.classList.add("free");cell.innerHTML='<div class="txt">FREE<span class="sub">CONTROL ZONE</span></div>';}
      else{
        const idx=mode==="write"?k++:order[k++];
        if(mode==="write"){
          const n=document.createElement("span");n.className="num";n.textContent=String(idx+1).padStart(2,"0");
          const ta=document.createElement("textarea");ta.id="sq"+idx;ta.maxLength=60;ta.value=squares[idx];
          ta.placeholder="type…";ta.setAttribute("aria-label","Square "+(idx+1));
          ta.addEventListener("input",()=>{squares[idx]=ta.value;$("linkOut").hidden=true;save();countStatus();});
          cell.append(n,ta);
        }else{
          const t=document.createElement("div");t.className="txt";t.textContent=squares[idx]||"—";
          cell.append(t);cell.tabIndex=0;cell.setAttribute("role","button");
          if(marks.has(pos))cell.classList.add("marked");
          const tog=()=>{marks.has(pos)?marks.delete(pos):marks.add(pos);save();render();};
          cell.addEventListener("click",tog);
          cell.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog();}});
        }
      }
      grid.append(cell);
    }
    $("mWrite").setAttribute("aria-pressed",mode==="write");
    $("mPlay").setAttribute("aria-pressed",mode==="play");
    $("share").hidden=mode!=="write"; $("wipeRow").hidden=mode!=="write";
    checkWin();countStatus();
  }
  function checkWin(){
    if(mode!=="play"){$("banner").hidden=true;return;}
    const has=p=>p===12||marks.has(p), wins=lines.filter(l=>l.every(has));
    wins.flat().forEach(p=>{if(p!==12)grid.children[p].classList.add("win")});
    $("banner").hidden=!wins.length;
  }
  function countStatus(){
    const filled=squares.filter(s=>s.trim()).length;
    status.textContent=mode==="write"
      ? `Write mode: ${filled}/24 squares filled.`
      : `Play mode: tap a square when it happens. ${marks.size} marked.`;
  }
  $("mWrite").onclick=()=>{mode="write";save();render();};
  $("mPlay").onclick=()=>{mode="play";save();render();};
  $("shuffle").onclick=()=>{order=shuffleOrder();marks.clear();save();render();};
  $("clearMarks").onclick=()=>{marks.clear();save();render();};

  $("copyLink").onclick=()=>{
    const filled=squares.filter(s=>s.trim()).length;
    const url=location.origin+location.pathname+"#s="+enc(squares.map(s=>s.replace(/\n/g," ").trim()));
    const out=$("linkOut");out.value=url;out.hidden=false;
    const done=()=>status.textContent=`Squad link copied (${filled}/24 squares). Paste it in Discord.`;
    if(navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(done).catch(()=>{out.select();status.textContent="Link selected below. Copy it manually.";});
    else {out.select();status.textContent="Link selected below. Copy it manually.";}
  };

  const wipeRow=$("wipeRow");
  function restore(){wipeRow.innerHTML='<button id="wipe" class="danger">Erase all squares</button>';
    $("wipe").onclick=()=>{
      wipeRow.innerHTML='<span>Erase all 24 squares?</span><button id="yes" class="danger">Erase</button><button id="no">Keep</button>';
      $("yes").onclick=()=>{squares=Array(N).fill("");marks.clear();save();restore();render();};
      $("no").onclick=restore;};}
  restore();
  render();
})();
</script>
</body>
</html>
