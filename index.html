<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15170f">
<title>Wardogs Squad Bingo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#15170f; --panel:#1f2216; --cell:#262a1b; --line:#3a3f2a;
  --fg:#e7e4d2; --muted:#9a9a80; --accent:#f2a516; --hit:#c8401f; --zone:#7fae3a;
  --display:"Black Ops One", Impact, "Arial Black", sans-serif;
  --body:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:repeating-linear-gradient(135deg,transparent 0 22px,rgba(242,165,22,.025) 22px 44px);}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:4px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,56px);line-height:.95;margin:0;letter-spacing:.02em}
h1 span{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font-family:var(--body);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent)}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--hit)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--line);padding:4px;border-radius:4px}
.cell{position:relative;aspect-ratio:1;max-width:100%;background:var(--cell);display:flex;align-items:center;justify-content:center;
  text-align:center;padding:4px;min-width:0;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.cell .txt{font-weight:600;font-size:clamp(11px,2.6vw,15px);line-height:1.1;overflow-wrap:anywhere}
.cell.empty .txt{color:var(--line)}
.cell.marked{background:#3a1d12}
.cell.marked::after{content:"";position:absolute;inset:10%;border:3px solid var(--hit);border-radius:50%;transform:rotate(-8deg);opacity:.9}
.cell.win{background:#4a2410}
.free{background:#22301a;cursor:default}
.free .txt{font-family:var(--display);font-weight:400;color:var(--zone);font-size:clamp(11px,2.4vw,15px)}
.free .sub{display:block;font-family:var(--mono);font-size:8px;color:var(--muted);margin-top:2px;letter-spacing:.08em}
.banner{font-family:var(--display);font-size:28px;color:#1a1405;background:var(--accent);text-align:center;padding:8px;border-radius:4px;letter-spacing:.06em}
[hidden]{display:none!important}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.foot{font-family:var(--mono);font-size:11px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.cell.marked::after{animation:stamp .18s ease-out}}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.4);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag">Squad card · tap squares as they happen</div>
    <h1>WARDOGS <span>BINGO</span></h1>
  </header>

  <div class="bar">
    <div class="confirm" id="dealRow"></div>
    <button id="clearMarks">Clear marks</button>
    <button class="primary" id="copyLink">Copy squad link</button>
  </div>
  <div class="status" id="status">Loading squares…</div>

  <div class="banner" id="banner" hidden>BINGO — ZONE CAPTURED</div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
(function(){
  const N=24, KEY="wardogs-card-v2";
  const $=id=>document.getElementById(id), grid=$("grid"), status=$("status");
  const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},
               set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)};

  let pool=[], poolId="", card=[], marks=new Set();

  const lines=[];for(let r=0;r<5;r++){lines.push([0,1,2,3,4].map(c=>r*5+c));lines.push([0,1,2,3,4].map(c=>c*5+r));}
  lines.push([0,6,12,18,24],[4,8,12,16,20]);

  function deal(){
    const p=[...pool];
    for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
    card=p.slice(0,N); marks.clear(); save(); render();
  }
  const save=()=>store.set(KEY,{poolId,card,marks:[...marks]});

  function render(){
    grid.innerHTML="";
    let k=0;
    for(let pos=0;pos<25;pos++){
      const cell=document.createElement("div");cell.className="cell";
      if(pos===12){cell.classList.add("free");cell.innerHTML='<div class="txt">FREE<span class="sub">CONTROL ZONE</span></div>';}
      else{
        const text=card[k++];
        const t=document.createElement("div");t.className="txt";t.textContent=text||"—";
        if(!text)cell.classList.add("empty");
        cell.append(t);cell.tabIndex=0;cell.setAttribute("role","button");
        if(marks.has(pos))cell.classList.add("marked");
        const tog=()=>{marks.has(pos)?marks.delete(pos):marks.add(pos);save();render();};
        cell.addEventListener("click",tog);
        cell.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog();}});
      }
      grid.append(cell);
    }
    const has=p=>p===12||marks.has(p), wins=lines.filter(l=>l.every(has));
    wins.flat().forEach(p=>{if(p!==12)grid.children[p].classList.add("win")});
    $("banner").hidden=!wins.length;
    if(!status.classList.contains("err"))
      status.textContent=pool.length<N
        ? `Only ${pool.length} squares in the list. Add at least ${N} to squares.txt.`
        : `${marks.size} marked.`;
  }

  // New card needs a confirm so a stray tap mid-match doesn't wipe your marks
  const dealRow=$("dealRow");
  function dealBtn(){dealRow.innerHTML='<button id="newCard">New card</button>';
    $("newCard").onclick=()=>{
      if(!marks.size){deal();return;}
      dealRow.innerHTML='<span>Toss this card?</span><button id="yes">Deal</button><button id="no">Keep</button>';
      $("yes").onclick=()=>{deal();dealBtn();}; $("no").onclick=dealBtn;};}
  dealBtn();

  $("clearMarks").onclick=()=>{marks.clear();save();render();};
  $("copyLink").onclick=()=>{
    const url=location.origin+location.pathname;
    const ok=()=>status.textContent="Link copied: "+url;
    const fail=()=>status.textContent="Share this link: "+url;
    navigator.clipboard?.writeText ? navigator.clipboard.writeText(url).then(ok).catch(fail) : fail();
  };

  // Load the master list. Lines starting with # are notes, blank lines are skipped.
  fetch("squares.txt",{cache:"no-store"})
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.text();})
    .then(txt=>{
      pool=[...new Set(txt.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!s.startsWith("#")).map(s=>s.slice(0,60)))];
      poolId=hash(pool.join("\n"));
      $("foot").textContent=`${pool.length} squares in the list · each card draws ${Math.min(N,pool.length)}`;
      const saved=store.get(KEY);
      if(saved&&saved.poolId===poolId&&Array.isArray(saved.card)){card=saved.card;marks=new Set(saved.marks||[]);render();}
      else deal(); // first visit, or the list changed since last time
    })
    .catch(()=>{
      status.classList.add("err");
      status.textContent="Couldn't load squares.txt. Make sure it's uploaded next to index.html.";
      render();
    });
})();
</script>
</body>
</html>
